name: android

on:
  push:
    branches: ['**']
    paths: ['core/**', 'app/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['core/**', 'app/android/**', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners ship the Android SDK; this sets ANDROID_HOME and installs what is missing.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Rust lint and tests
        working-directory: core
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Build debug APK
        working-directory: app/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kahie-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
