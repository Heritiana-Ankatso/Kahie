name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in app/web/src/*.js app/web/sw.js; do node --check "$f"; done
      - name: Unit tests
        working-directory: app/web
        run: node --test tests/
